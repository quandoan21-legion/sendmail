<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Email Campaign</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef1f5;
            padding: 40px 0;
            margin: 0;
        }

        .email-container {
            max-width: 650px;
            margin: auto;
            background-color: #ffffff;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            line-height: 1.65;
            border: 1px solid #e6e9ef;
        }

        h2 {
            text-align: center;
            color: #2d2d2d;
            margin-bottom: 28px;
            font-size: 26px;
            letter-spacing: 0.3px;
            font-weight: 600;
        }

        .section-title {
            font-weight: 600;
            color: #4a4a4a;
            margin-top: 18px;
            margin-bottom: 6px;
            font-size: 16.5px;
        }

        .section-content {
            color: #333333;
            font-size: 15.5px;
            margin-bottom: 18px;
            white-space: pre-line; /* giữ nguyên xuống dòng nội dung người dùng nhập */
            padding: 12px 14px;
            background: #fafbfc;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        hr {
            border: 0;
            border-top: 1px solid #e5e7eb;
            margin: 30px 0;
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-top: 10px;
            padding-top: 10px;
        }
    </style>
</head>
<body>
<div class="email-container">

    <h2>📩 Email Campaign</h2>

    <div>
        <div class="section-title">Nội dung:</div>
        <div class="section-content" th:text="${content}">Email content here...</div>
    </div>

    <div>
        <div class="section-title">Sản phẩm:</div>
        <div class="section-content" th:text="${product}">Product name...</div>
    </div>

    <hr>

    <div class="footer">
        Đây là email được gửi tự động từ hệ thống Send Mail Campaign.
    </div>

</div>
</body>
</html>
