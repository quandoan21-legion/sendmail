<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Send Mail Campaign</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px 15px; /* padding nhỏ hai bên để không bị lệch trên màn nhỏ */
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: 600;
        }

        form {
            background: #fff;
            max-width: 600px;
            width: 100%; /* tránh bị lệch khi màn nhỏ */
            margin: auto;
            padding: 28px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
            box-sizing: border-box; /* tránh tràn padding làm lệch */
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            color: #555;
            font-size: 15px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 11px 13px;
            margin-top: 6px;
            border: 1px solid #cfd3d8;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        textarea {
            min-height: 110px;
        }

        button {
            display: block;
            margin-top: 22px;
            width: 100%;
            padding: 13px;
            font-size: 17px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #0056b3;
        }

        .autocomplete-suggestions {
            border: 1px solid #ccc;
            max-height: 160px;
            overflow-y: auto;
            background: white;
            z-index: 1000;
            width: 100%;
            position: relative;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .suggestion {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
        }

        .suggestion:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
<h2>Send Mail Campaign</h2>
<form th:action="@{/mail-campaign/send}" th:object="${mailCampaignRequest}" method="post" autocomplete="off">
    <label>Recipients (comma-separated emails):</label>
    <input type="text" id="recipients" th:field="*{recipients}" placeholder="abc@gmail.com, xyz@gmail.com" required pattern="^([a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,})(\s*,\s*[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,})*$" title="Nhập đúng định dạng email. Nhiều email cách nhau bằng dấu phẩy."/>
    <div id="suggestions" class="autocomplete-suggestions"></div>

    <p th:if="${error}" th:text="${error}" style="color:red; margin-top:5px;"></p>

    <label>Title:</label>
    <input type="text" th:field="*{title}" placeholder="Email title"/>
    <label>Content:</label>
    <textarea th:field="*{content}" placeholder="Enter email content"></textarea>
    <label>Product:</label>
    <input type="text" th:field="*{product}" placeholder="Product name"/>
    <button type="submit">Send Mail</button>
</form>

<script>
    const input = document.getElementById('recipients');
    const suggestionBox = document.getElementById('suggestions');

    input.addEventListener('input', async function() {
        const val = this.value.split(',').pop().trim(); // lấy từ cuối
        if (!val) { suggestionBox.innerHTML=''; return; }

        const res = await fetch('/mail-campaign/suggest-emails?q=' + encodeURIComponent(val));
        const emails = await res.json();

        suggestionBox.innerHTML = '';
        emails.forEach(email => {
            const div = document.createElement('div');
            div.textContent = email;
            div.classList.add('suggestion');
            div.addEventListener('click', () => {
                let parts = input.value.split(',');
                parts[parts.length-1] = email; // thay phần cuối
                input.value = parts.join(', ') + ', ';
                suggestionBox.innerHTML = '';
                input.focus();
            });
            suggestionBox.appendChild(div);
        });
    });

    document.addEventListener('click', (e) => {
        if (e.target !== input) suggestionBox.innerHTML = '';
    });
</script>
</body>
</html>
